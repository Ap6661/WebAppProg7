<!DOCTYPE html>
<html lang="en">
<head>
  <title>Reflex Game</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" 
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" 
    integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" 
    integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>  

  </head>
<body>

  <h1>Bosch Reflexes</h1>


  <div id='target'>
    Your time
  </div>

  <div id='counter'>
    Count
  </div>



  <button type="button" class="btn btn-primary" onclick='beginTime()'>Go</button>
  <button type="button" class="btn btn-primary" onclick='recordTime()'>Halt</button>

  <h3 id='countdown'>
  </h3>

  <script>
    var haltTime = 0; 

    function recordTime() {
      haltTime = Date.now();
      console.log(haltTime);
    }

    function beginTime() {
      var countdown = document.getElementById('countdown');
      for (var i = 0; i <= 5; i++) {
        setTimeout(function(a) {
          countdown.innerHTML = 5 - a
        }, i * 1000, i);
      }
      setTimeout(function() {
        target = document.getElementById("target");
        if (haltTime == 0) {
          target.innerHTML = "Not Soon Enough";
        } else {
          targetTime = Date.now();
          target.innerHTML = "Time was " + (targetTime - haltTime);
        }
      }, 5000);
    }
  </script>

</body>
</html>
